<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BankCorp Secure Login</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top, #0f172a 0%, #020617 55%);
            color: #e2e8f0;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .panel {
            width: min(460px, 100%);
            padding: 28px 30px;
            border: 1px solid rgba(148, 163, 184, .16);
            border-radius: 24px;
            background: rgba(15, 23, 42, .92);
            box-shadow: 0 32px 90px rgba(15, 23, 42, .35);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 2rem;
            letter-spacing: .02em;
        }
        p.lead {
            margin: 0 0 24px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .field {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: .95rem;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, .24);
            background: rgba(15, 23, 42, .8);
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
        }
        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, .12);
        }
        button {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            cursor: pointer;
            transition: transform .2s ease, filter .2s ease;
        }
        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }
        .meta {
            margin-top: 22px;
            font-size: .92rem;
            color: #94a3b8;
            text-align: center;
        }
        .meta a {
            color: #93c5fd;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>BankCorp Secure Login</h1>
        <p class="lead">Enter your credentials to access the secure banking portal. The system is built as a layered service platform with separate API endpoints for profile, accounts, and transaction data.</p>
        <form method="POST" action="/api/auth/login">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
            </div>
            <button type="submit">Login</button>
        </form>
        <p class="meta">Not a customer? Preview the app at <a href="/dashboard">Dashboard demo</a>.</p>
    </div>
</body>
</html>
