<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BankCorp Profile</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #0f172a 0%, #020617 54%);
            color: #e2e8f0;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .panel {
            width: min(520px, 100%);
            padding: 30px;
            border: 1px solid rgba(148, 163, 184, .18);
            border-radius: 28px;
            background: rgba(15, 23, 42, .94);
            box-shadow: 0 34px 90px rgba(15, 23, 42, .24);
        }
        .heading {
            margin: 0 0 16px;
            font-size: 1.9rem;
            letter-spacing: .01em;
        }
        .subtitle {
            margin: 0 0 24px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .field {
            padding: 16px 18px;
            border-radius: 18px;
            background: rgba(15, 23, 42, .85);
            border: 1px solid rgba(148, 163, 184, .14);
        }
        .field strong { display: block; margin-bottom: 8px; color: #cbd5e1; }
        .field span { color: #f8fafc; }
        .link-row {
            margin-top: 24px;
            text-align: center;
        }
        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(147, 197, 253, .18);
            background: rgba(59, 130, 246, .14);
            color: #93c5fd;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="heading">{{ profile.name }}</div>
        <div class="subtitle">Customer profile details for the BankCorp service layer. This page is part of the first API layer in the real-app workflow.</div>
        <div class="row">
            <div class="field"><strong>Email</strong><span>{{ profile.email }}</span></div>
            <div class="field"><strong>Phone</strong><span>{{ profile.phone }}</span></div>
            <div class="field"><strong>Address</strong><span>{{ profile.address }}</span></div>
            <div class="field"><strong>Joined</strong><span>{{ profile.joined }}</span></div>
        </div>
        <div class="link-row">
            <a class="link-button" href="/dashboard">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
